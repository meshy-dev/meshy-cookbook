name: Validate cookbook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r examples/01-image-to-3d-character/python/requirements.txt
          npm ci
      - name: Validate recipes and offline behavior
        env:
          MESHY_API_KEY: ''
        run: |
          python scripts/publish.py validate
          python -m compileall -q shared/python examples/*/python
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
          npm run check
      - name: Build website content
        run: python scripts/publish.py build --output dist --require-clean
      - name: Save website content for review
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cookbook-content
          path: dist/
          if-no-files-found: error
