schema_version: 1
slug: text-to-unreal-asset
order: 15
title: Make a 3D asset and place it in Unreal with your coding agent
description: Describe a game asset, and your coding agent makes a concept image and
  then a textured GLB from it with the Meshy CLI, and places it in an Unreal Engine
  level through Unreal MCP once you drag the file in. No code.
authors:
- serafin-meshy
contributor: meshy
date: '2026-11-10'
tags:
- unreal-engine
- game-engine
- mcp
- coding-agent
- meshy-cli
- text-to-image
- image-to-3d
readme: README.md
input:
  type: text
  description: An image prompt that describes a game asset, written into the agent prompt.
    The recipe includes a robot charging dock.
  files: []
outputs:
- glb
endpoints:
- text-to-image
- image-to-3d
model_policy: The prompt names every model. Text to Image runs gpt-image-2, and Image
  to 3D runs meshy-7.1 geometry with meshy-7 PBR textures at 4K from the image's task
  ID.
agent:
  runtime: Node.js 22.12+, Meshy CLI 0.8.5+, a paid Meshy plan (Pro or above), Unreal
    Engine 5.8, and a coding agent with terminal access
  files:
  - agent/README.md
  - agent/prompts.md
  - agent/mcp/claude-code.json
  - agent/mcp/cursor.json
  - agent/mcp/codex.md
estimates:
  credits: 39
  time_seconds:
    min: 120
    max: 160
  basis: Two live runs on macOS on November 9, 2026, 39 credits each (9 for the gpt-image-2
    image and 30 for the meshy-7.1 model with meshy-7 4K PBR textures, read from consumed_credits).
    The Meshy CLI 0.8.5 run took 34 seconds for the image command and 86 for the model
    command. The Claude Code run of the Step 4 prompt took about 55 seconds from the
    image's approval to the agent showing the image, and 105 seconds from the model's
    approval to the GLB on disk. Covers generation only, not the time you take to approve
    or the Unreal import and placement. Observed range, not a service guarantee.
last_verified: '2026-11-09'
verification_note: Two live runs on macOS on November 9, 2026, signed in to the Meshy
  CLI 0.8.5 through the browser with no API key. One ran text-to-image and image-to-3d
  directly with the CLI from the Step 3 prompt, after a first image from a draft of
  the prompt that still had cables. The other ran the Step 1 and Step 4 prompts in
  Claude Code with the meshy-3d-agent skills installed in a new Unreal Engine 5.8.2
  Third Person project, with Unreal MCP and All Toolsets on and Auto Start Server set.
  The Step 4 prompt then didn't name the 3D models; the agent proposed meshy-t2 with
  meshy-n1 and was told to use meshy-7.1 with meshy-7 at 4K, which the published prompt
  now names. The agent's import tool refused the GLB, the GLB was imported with Interchange's
  default options from the editor's Python API in place of the drag-and-drop, and the
  agent placed it on the platform 2.3 m from the PlayerStart, turned to face it, with
  its whole base on flat floor. Windows was not tested.
previews:
- path: assets/concept.png
  alt: Concept art of a robot charging dock with a round orange pad, yellow and black
    hazard stripes, a short orange tower with a five-bar green battery meter, and a scuffed
    steel base with four bolts
  role: concept
- path: assets/result.png
  alt: The 3D robot charging dock as Meshy rendered it, matching the concept image
  role: result
assets:
- assets/SOURCES.md
- assets/in-unreal.jpg
- assets/static-mesh-editor.jpg
sample_result: sample-result.json
site:
  slug: place-3d-asset-in-unreal
  description: Describe a game asset, and your coding agent makes it with the Meshy
    CLI and places it in your Unreal level through Unreal MCP.
  topics:
  - Game engines
  - Text to 3D
  short_name: Text to Unreal asset
