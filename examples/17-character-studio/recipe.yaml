estimates:
  credits: 38
  time_seconds:
    min: 141
    max: 217
  basis: Two characters generated in the app on November 24, 2026, a robot barista
    and a Viking, each charged 20, 10, 5 and 3 credits, read from consumed_credits.
    Times run from the first task's creation to the idle clip's file on Meshy's storage,
    141 and 217 seconds. In the robot run, library animations took 10 to 11 seconds
    for 3 credits each and a described move about 30 seconds for 13. Observed range,
    not a service guarantee.
last_verified: '2026-11-24'
verification_note: 'Two characters generated in the app''s live mode on November
  24, 2026, before this recipe removed the app''s mock mode and demo reel; the Meshy
  requests are unchanged. The tasks were read back from the Meshy API on November
  24, 2026: each character was a text-to-3d preview (20 credits), refine (10), rigging
  (5) and Idle animation, action 0 (3). The robot run also played three library animations
  (3 credits each) and one described move (text-to-motion prime, 6 seconds, 10 credits,
  then an animation task, 3). Stage times come from task creation times and the Last-Modified
  time of each task''s GLB. The pictured stage is this recipe''s app in Chrome on macOS,
  loading the robot run''s downloaded files. The AI director was not run with a model
  for this recipe; the agent bridge it drives is covered by the app''s tests.'
