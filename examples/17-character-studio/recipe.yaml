schema_version: 1
slug: character-studio
order: 17
title: 'Character Studio: generate a 3D character and direct it with an AI agent'
description: A Next.js app that turns one sentence into a textured, rigged, idling
  3D character with Meshy, then lets you or an AI agent direct it on a 3D stage with
  678 library animations, described moves, camera shots, finishes and lighting.
authors:
- serafin-meshy
contributor: meshy
date: '2026-11-24'
tags:
- application
- web-app
- nextjs
- react
- three.js
- ui-sdk
- ai-agent
- character
- text-to-3d
- rigging
- animation
- text-to-motion
readme: README.md
input:
  type: text
  description: A one-sentence description of one character on two legs. The app suggests
    three, and the recipe's sample is the robot barista.
  files: []
outputs:
- glb
endpoints:
- text-to-3d
- rigging
- animations
- text-to-motion
model_policy: The text-to-3d preview sends ai_model latest, so it follows Meshy's
  current model, and the refine textures that preview. Text to Motion uses mode prime.
  The rigging and animation endpoints have no model selection. The AI director uses
  Claude Sonnet 5.5, through an Anthropic API key or Vercel AI Gateway; AGENT_ANTHROPIC_MODEL
  and AGENT_MODEL name others.
app:
  runtime: Node.js 22+ and a desktop browser with WebGL; optionally the Meshy CLI
    0.8.6+ to sign in with a browser instead of a key, and an Anthropic API key or
    a Vercel AI Gateway key for the director
